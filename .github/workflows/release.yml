name: Release

on:
  push:
    tags:
      - "*"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci
      - run: npm run build
      - name: Check the tag matches the manifest
        run: |
          manifest="$(node -p "require('./manifest.json').version")"
          test "$manifest" = "$GITHUB_REF_NAME" \
            || { echo "manifest.json is $manifest but the tag is $GITHUB_REF_NAME"; exit 1; }
          node -e "
            const v = require('./versions.json');
            if (!v['$GITHUB_REF_NAME']) { console.error('versions.json has no entry for $GITHUB_REF_NAME'); process.exit(1); }
          "
      - name: Extract release notes
        run: |
          awk -v version="$GITHUB_REF_NAME" '
            index($0, "## [" version "] - ") == 1 { found = 1; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md > release-notes.md
          test -s release-notes.md
      - name: Create release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="${GITHUB_REF_NAME}"
          gh release create "$tag" \
            --title="Release $tag" \
            --latest \
            --notes-file=release-notes.md \
            main.js manifest.json styles.css \
            assets/fonts/FlowCircular-OFL.txt
