name: Release

on:
  push:
    tags:
      - "*"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check the tag matches the manifest
        env:
          TAG: ${{ github.ref_name }}
        run: |
          # shellcheck disable=SC2016  # the ${} below are JS template literals, not shell
          node -e '
            const tag = process.env.TAG;
            const manifest = require("./manifest.json").version;
            if (manifest !== tag) {
              console.error(`manifest.json is ${manifest} but the tag is ${tag}`);
              process.exit(1);
            }
            if (!require("./versions.json")[tag]) {
              console.error(`versions.json has no entry for ${tag}`);
              process.exit(1);
            }
          '
      - run: npm ci
      - run: npm run build
      - name: Extract release notes
        run: |
          awk -v version="$GITHUB_REF_NAME" '
            index($0, "## [" version "] - ") == 1 { found = 1; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md > release-notes.md
          test -s release-notes.md
      - name: Create release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="${GITHUB_REF_NAME}"
          gh release create "$tag" \
            --title="Release $tag" \
            --latest \
            --notes-file=release-notes.md \
            main.js manifest.json styles.css \
            assets/fonts/FlowCircular-OFL.txt
